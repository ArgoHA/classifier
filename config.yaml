project_name: my_project # for wandb
exp_name: baseline # experiment name

exp: ${exp_name}_${now_dir}

model_name: efficientnet_b0 # models from timm - https://huggingface.co/docs/timm/en/models/

train:
  root: /path # project root with dataset and outputs
  pretrained: True

  data_path: ${train.root}/data/dataset # path to dataset
  path_to_test_data: ${train.root}/data/to_test # path to test data used infer
  path_to_save: ${train.root}/output/models/${exp} # where to save output

  debug_img_path: ${train.root}/output/debug_images
  eval_preds_path: ${train.root}/output/eval_preds
  bench_img_path: ${train.root}/output/bench_imgs
  infer_path: ${train.root}/output/infer
  visualized_path: ${train.root}/output/visualized

  ### Configs ###
  use_wandb: True
  device: cuda

  label_to_name: # dataset's classes
    0: "class_1"
    1: "class_2"
    2: "class_3"

  img_size: [256, 256] # (h, w)
  to_visualize_eval: True # save images with gt and preds
  debug_img_processing: True # save images after preprocessing
  to_save_errors: True # during bench saves images with incorrect prediction

  amp_enabled: True # use automatic mixed precision
  amp_dtype: bfloat16 # bfloat16 (fp32 exponent range, no loss scaling) | float16
  clip_max_norm: 1.0 # gradient clipping
  decision_metrics: [f1] # mean of these picks the best checkpoint

  batch_size: 64 # physical, should fit on the device
  b_accum_steps: 1 # grad accumulation (n * bs)
  epochs: 15
  label_smoothing: 0.1
  layers_to_train: -1
  early_stopping: 0 # 0 - no early stopping
  num_workers: 12

  ### EMA ###
  use_ema: False # use exponential moving average model
  ema_momentum: 0.9998

  ### Optimizer and Scheduler ###
  base_lr: 0.0001
  backbone_lr: null # null = same as base_lr; set lower to fine-tune gently
  max_lr_mult: 10 # OneCycleLR peak = per-group lr * this
  cycler_pct_start: 0.1
  weight_decay: 0.0001
  betas: [0.9, 0.999]

  ### Augs ###
  augs:
    rotation_degree: 10 # maximum +- rotation
    rotation_p: 0.05 # probability of the rotation (with above degree)
    multiscale_prob: 0.0
    rotate_90: 0.3
    left_right_flip: 0.3
    up_down_flip: 0.2
    to_gray: 0.0
    blur: 0.0
    gamma: 0.0
    brightness: 0.01
    noise: 0.0
    coarse_dropout: 0.0

    ### Mixup / CutMix (timm) - both 0.0 disables it entirely ###
    mixup_alpha: 0.0 # beta dist alpha for mixup; 0.2-0.8 is typical when on
    cutmix_alpha: 0.0 # beta dist alpha for cutmix; 1.0 is typical when on
    mixup_prob: 1.0 # chance of applying either, per batch
    mixup_switch_prob: 0.5 # chance of picking cutmix over mixup when both are on

  seed: 42
  cudnn_fixed: True


bench:
  formats: null # null = torch + tensorrt + openvino + onnx; a list restricts it

infer:
  zero_shot: false # true -> classify with a zero-shot dual encoder
  hub: hf-hub:timm/ViT-SO400M-16-SigLIP2-256 # open_clip checkpoint (image tower: a timm model)
  template: "a photo of a {label}." # prompt wrapped around every label from train.label_to_name

demo:
  host: "0.0.0.0" # reachable from the LAN; "127.0.0.1" keeps the page on this machine
  port: 7860
  share: false # gradio's public tunnel

check_errors:
  split: test # which split `make check_errors` walks


split:
  shuffle: True
  train_split: 0.8
  val_split: 0.1 # test_split = 1 - train_split - val_split


export: # TensorRT must be done on the inference device
  half: False
  max_batch_size: 1
  opt_batch_size: 1 # batch TensorRT tunes its kernels for; clamped to max_batch_size
  dynamic_input: False # free height/width in the graph; the wrappers resize, so off
  formats: null # null = onnx + openvino + tensorrt; a list restricts it
  simplify: False # onnxsim pass, non-fatal. Off by default: torch.onnx's dynamo
  # exporter already runs its own optimizer, so onnxsim is a 239->239 node no-op here
  parity: True # compare every exported backend's softmax against torch
  parity_images: 8 # real val images used for the parity check


### service ###
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

now_dir: &nowdir ${now:%Y-%m-%d}
